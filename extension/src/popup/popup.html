<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>job-tracker</title>
  <link rel="stylesheet" href="popup.css" />
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="../../icons/icon48.png" alt="" />
      <span class="brand-name">job-tracker</span>
    </div>
    <div class="status" role="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
  </header>

  <main class="body">
    <!-- First run: which dashboard to talk to -->
    <form data-view="setup" hidden id="setupForm" class="setup" novalidate>
      <div class="section">
        <div class="section-head"><b>[00]</b><span>Setup</span></div>
        <div class="notice">
          <h2>Connect your dashboard</h2>
          <p>Enter the address of your job-tracker dashboard. You'll sign in there, and the extension uses that session.</p>
        </div>
        <label class="field">
          <span class="label">Dashboard address</span>
          <input class="input" name="dashboard" type="url" inputmode="url" placeholder="https://job-tracker.example.com" autocomplete="url" spellcheck="false" required />
        </label>
        <p class="result" data-tone="error" data-error role="alert" hidden></p>
        <button class="btn" type="submit">Save</button>
      </div>
    </form>

    <!-- Signed out -->
    <section data-view="signin" hidden>
      <div class="section">
        <div class="section-head"><b>[00]</b><span>Auth</span></div>
        <div class="notice">
          <h2>Sign-in required</h2>
          <p>Open the dashboard, sign in with Google, then reopen this popup.</p>
          <button class="btn" type="button" data-action="dashboard">Open dashboard</button>
        </div>
      </div>
    </section>

    <!-- Can't reach the dashboard, or can't run on this tab -->
    <section data-view="message" hidden>
      <div class="section">
        <div class="section-head"><b>[00]</b><span id="messageLabel">Status</span></div>
        <div class="notice">
          <h2 id="messageTitle"></h2>
          <p id="messageBody"></p>
        </div>
      </div>
    </section>

    <!-- The job on this page -->
    <form data-view="job" hidden id="jobForm" novalidate>
      <div class="section">
        <div class="section-head"><b>[01]</b><span>Job</span></div>
        <label class="field">
          <span class="label">Company</span>
          <input class="input" id="company" name="company" maxlength="100" placeholder="Company name" autocomplete="off" required />
        </label>
        <label class="field">
          <span class="label">Role</span>
          <input class="input" id="role" name="role" maxlength="150" placeholder="Role title" autocomplete="off" required />
        </label>
        <div class="field" id="statusField" hidden>
          <div class="field-head">
            <label class="label" for="status">Status</label>
            <button class="link" type="button" id="newApplicationBtn" title="Track this page as a new application">Not this job?</button>
          </div>
          <select class="input" id="status"></select>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><b>[02]</b><span>Actions</span></div>
        <button class="btn" type="submit" id="applyBtn">Apply &amp; fill</button>
        <div class="actions">
          <button class="btn secondary" type="button" id="saveBtn">Save job</button>
          <button class="btn secondary" type="button" id="tailorBtn">Tailor CV</button>
        </div>
        <div class="result" data-result hidden></div>
      </div>
    </form>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <button class="link accent" type="button" data-action="dashboard" id="dashboardLink">Open dashboard</button>
      <button class="link" type="button" data-action="options">Settings</button>
    </div>
    <span class="footer-count" id="footerCount"></span>
  </footer>
</body>
</html>

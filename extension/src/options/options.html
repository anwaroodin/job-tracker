<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>job-tracker options</title>
  <link rel="stylesheet" href="../popup/popup.css" />
  <script type="module" src="options.js"></script>
</head>
<body>
  <main class="body">
    <form id="dashboardForm" class="setup" novalidate>
      <div class="section">
        <div class="section-head"><b>[01]</b><span>Dashboard</span></div>
        <label class="field">
          <span class="label">Dashboard address</span>
          <input class="input" name="dashboard" type="url" inputmode="url" placeholder="https://job-tracker.example.com" autocomplete="url" spellcheck="false" required />
        </label>
        <p class="result" data-tone="error" data-error role="alert" hidden></p>
        <p class="result" data-tone="success" id="saved" role="status" hidden>Saved. Sign in on the dashboard if you haven't yet.</p>
        <button class="btn" type="submit">Save</button>
      </div>
    </form>
  </main>
</body>
</html>
